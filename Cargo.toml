[package]
name = "rustTun"
version = "0.1.0"
edition = "2024"

[dependencies]
tun2 = "4"

tokio = {version = "1", features = ["full"]}
tokio-cron-scheduler = "0.4" # 请确认使用最新版本

byteorder = "1"
etherparse = "0.16"     # 版本对一下 docs.rs
hickory-proto = "0.24"      # 原 trust-dns-proto

log = "0.4"  #日志接口
env_logger = "0.10" #日志实现
